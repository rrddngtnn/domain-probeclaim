[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sybil"
version = "0.1.0"
description = "Deterministic synthetic identities, sticky network routing, and error-diffing schema discovery."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
mock = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
sybil = "sybil.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
